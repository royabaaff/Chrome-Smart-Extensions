<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    🌍 Smart SOCKS Proxy
  </div>

  <div class="container">
    <div class="card">
      <div class="input-group">
        <label>آی‌پی سرور (IP)</label>
        <input type="text" id="proxy-ip" placeholder="127.0.0.1">
      </div>
      <div class="input-group">
        <label>پورت (Port)</label>
        <input type="number" id="proxy-port" placeholder="1080">
      </div>
      <div class="input-group">
        <label>دامنه‌های مستثنی شده (Bypass)</label>
        <textarea id="bypass-list" placeholder="*.ir, localhost, 127.0.0.1"></textarea>
      </div>
      <div class="btn-row">
        <button id="btn-connect">اتصال</button>
        <button id="btn-disconnect">قطع اتصال</button>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span>وضعیت پروکسی:</span>
        <span id="connection-status" class="status-badge off">غیرفعال</span>
      </div>
      <div class="status-row">
        <span>آی‌پی فعلی:</span>
        <span id="ip-address" class="ip-text">در حال بررسی...</span>
      </div>
      <div class="status-row">
        <span>موقعیت مکانی:</span>
        <span id="geo-location">...</span>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
